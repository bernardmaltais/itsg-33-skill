    evidence: k8s/rbac.yaml, k8s/deployment.yaml

  AC-3:
    finding: Pass
    reason: Namespace-scoped Role with explicit verb list (get, list, watch) present; no wildcard verbs
    evidence: k8s/rbac.yaml

  AC-4:
    finding: Pass
    reason: Default-deny NetworkPolicy present in sample-app namespace; ingress restricted to gateway namespace only
    evidence: k8s/deployment.yaml

  AC-5:
    finding: Pass
    reason: Separate audit-reader role and service account; deploy pipeline requires environment approval gate
    evidence: k8s/rbac.yaml, .github/workflows/ci.yaml

  AC-6:
    finding: Fail
    reason: ClusterRoleBinding granting cluster-admin to sample-app service account; Terraform IAM assigns Contributor (overly broad) role
    evidence: k8s/rbac.yaml, terraform/main.tf

  AC-7:
    finding: Not Assessable
    reason: No rate limiting config on auth endpoints found; no IdP Terraform or middleware config in fixture
    evidence: none

  AC-8:
    finding: Not Assessable
