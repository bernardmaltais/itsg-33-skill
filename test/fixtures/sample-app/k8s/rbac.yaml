# RBAC manifests for sample-app
# AC-6 FAIL: cluster-admin binding for app service account

apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app
  namespace: sample-app
  annotations:
    azure.workload.identity/client-id: "00000000-0000-0000-0000-000000000002"
---
# FAIL: cluster-admin granted to application service account
# Should be a namespace-scoped Role with only required verbs
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sample-app-cluster-admin
subjects:
  - kind: ServiceAccount
    name: sample-app
    namespace: sample-app
roleRef:
  kind: ClusterRole
  apiGroup: rbac.authorization.k8s.io
  name: cluster-admin
---
# AC-5 PASS: separate role for read-only audit access
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: audit-reader
  namespace: sample-app
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: audit-reader-binding
  namespace: sample-app
subjects:
  - kind: ServiceAccount
    name: audit-service
    namespace: monitoring
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: audit-reader
