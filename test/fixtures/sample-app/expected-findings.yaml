# Expected findings for the sample-app fixture
# Used by ticket #12 (verify itsg-33-assess) to assert correct skill output.
#
# Each entry documents:
#   finding: Pass | Fail | Not Assessable
#   reason:  plain-English explanation matching controls.md signal definitions
#   evidence: which fixture file(s) drive this finding

controls:

  # ── AC — Access Control ──────────────────────────────────────────────────

  AC-2:
    finding: Pass
